<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Binance API 连通性测试</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;padding:20px;background:#f5f6f8;color:#18202a}
main{max-width:760px;margin:auto}h1{font-size:23px}button{background:#f0b90b;border:0;border-radius:9px;padding:12px 18px;font-size:16px;font-weight:600}
.card{background:white;border-radius:12px;padding:14px;margin:14px 0;box-shadow:0 1px 5px #0001}
.status{font-weight:700}.ok{color:#16834a}.bad{color:#c0392b}
pre{white-space:pre-wrap;word-break:break-all;background:#101820;color:#d8e4ee;padding:12px;border-radius:8px;overflow:auto;font-size:12px}
small{color:#647080}
</style>
</head>
<body><main>
<h1>Binance 官方公开 API 连通性测试</h1>
<p>无需 API Key，不会登录账户、读取资产或提交订单。</p>
<button id="run">开始测试</button>
<p id="summary">尚未测试</p>
<div id="results"></div>
<script>
const tests=[
{name:"现货 Ping",url:"https://data-api.binance.vision/api/v3/ping"},
{name:"合约服务器时间",url:"https://fapi.binance.com/fapi/v1/time"},
{name:"BTCUSDT 最新价格",url:"https://fapi.binance.com/fapi/v1/ticker/price?symbol=BTCUSDT"},
{name:"BTCUSDT 最近 3 根 5 分钟 K 线（数组）",url:"https://fapi.binance.com/fapi/v1/klines?symbol=BTCUSDT&interval=5m&limit=3"},
{name:"合约交易规则",url:"https://fapi.binance.com/fapi/v1/exchangeInfo"}
];
const run=document.getElementById("run"),results=document.getElementById("results"),summary=document.getElementById("summary");
run.addEventListener("click",async()=>{
 run.disabled=true;run.textContent="测试中…";results.innerHTML="";let ok=0;
 for(const t of tests){
  const card=document.createElement("section");card.className="card";
  const h=document.createElement("h3");h.textContent=t.name;card.appendChild(h);
  const s=document.createElement("div");s.className="status";s.textContent="请求中…";card.appendChild(s);
  const pre=document.createElement("pre");pre.textContent="";card.appendChild(pre);results.appendChild(card);
  try{
   const res=await fetch(t.url,{cache:"no-store"});
   const body=await res.text();let parsed;try{parsed=JSON.parse(body)}catch{parsed=body}
   s.textContent="HTTP "+res.status+" "+(res.ok?"成功":"失败");s.className="status "+(res.ok?"ok":"bad");
   pre.textContent=typeof parsed==="string"?parsed:JSON.stringify(parsed,null,2);
   if(res.ok)ok++;
  }catch(e){
   s.textContent="请求失败（可能是网络或 CORS 限制）";s.className="status bad";pre.textContent=String(e);
  }
 }
 summary.textContent="测试完成："+ok+"/"+tests.length+" 个接口成功。结果时间："+new Date().toLocaleString();
 run.disabled=false;run.textContent="重新测试";
});
</script></main></body></html>
